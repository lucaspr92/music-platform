[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-copilot"
version = "0.1.0"
description = "Local-first AI music production copilot for Ableton Live"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0",
  "numpy>=2.0",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
perception = ["torch>=2.0", "transformers>=5.0"]
soniq = ["websocket-client>=1.9"]
mcp = ["mcp>=2.2,<3"]
# Librosa is ISC (permissive) and pure Python: wheel is py3-none-any.
analysis = ["librosa>=1.0,<2.0"]
# Essentia is AGPL-3.0 and its pre-trained models are NonCommercial (CC BY-NC-SA/ND):
# using this extra is a deliberate, recorded product decision that carries the licence
# obligation. Pinned because wheels are built per CPython version (the newest release
# ships cp314 only) and because there are NO Windows wheels: on Windows pip cannot
# install this extra at all, it needs a source build (waf + Eigen/FFmpeg/TagLib) or WSL.
essentia = ["essentia==2.1b6.dev1389", "essentia-tensorflow==2.1b6.dev1389"]

[project.scripts]
copilot = "copilot.cli:main"
copilot-mcp = "copilot.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"copilot.human_eval" = ["static/*"]
"copilot.review" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
